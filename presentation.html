<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>นำเสนองาน | การงานแต่ละวัน</title>
<style>
:root{--ink:#17202d;--muted:#78818f;--line:#e6eaf0;--blue:#3867f4;--bg:#f8faff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:white;font-size:21px}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px}.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:600}.primary{background:var(--blue);color:#fff}.back{background:#fff;color:var(--muted);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{font-size:18px;margin:0 0 16px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:600}.form input,.form textarea{display:block;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:6px;font:inherit}.form textarea{min-height:90px;resize:vertical}.preview{width:100%;max-height:210px;object-fit:contain;border-radius:10px;background:#f5f7fa;display:none}.slide{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}.slide h3{margin:0 0 5px}.slide p{color:var(--muted);font-size:12px;margin:0 0 12px}.slide img{width:100%;max-height:440px;object-fit:contain;border-radius:9px;background:#f5f7fa}.delete{margin-top:10px;background:#fff1f1;color:#c45858;padding:7px 10px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:45px}.notice{display:none;background:#fff2e8;color:#a85a20;padding:10px;border-radius:9px;margin-bottom:14px;font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.top .back{white-space:nowrap}}
</style>
</head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">✓</div><div><h1>นำเสนองาน</h1><small>รวมผลงานและรูปภาพของเรา</small></div></div><button class="btn back" onclick="location.href='index.html'">← กลับหน้าหลัก</button></header><div id="notice" class="notice"></div><div class="layout"><section class="panel"><h2>สร้างงานนำเสนอ</h2><form class="form" id="form"><label>หัวข้อ<input id="title" required placeholder="เช่น สรุปผลงานเดือนนี้"></label><label>รายละเอียด<textarea id="description" placeholder="เขียนรายละเอียดของงานนำเสนอ"></textarea></label><label>เลือกรูปภาพ<input id="image" type="file" accept="image/*"></label><img class="preview" id="preview"><button class="btn primary" type="submit">บันทึกงานนำเสนอ</button></form></section><section class="panel"><h2>งานนำเสนอทั้งหมด</h2><div id="list"></div></section></div></div><script>
const API='api.php';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(t){const n=$('#notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',4000)}async function request(body){const r=await fetch(API,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!x.ok)throw Error(x.error||'เกิดข้อผิดพลาด');return x}function render(items){$('#list').innerHTML=items.length?items.map(x=>`<article class="slide"><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p>${x.image_data?`<img src="${x.image_data}">`:''}<button class="btn delete" onclick="removeSlide(${x.id})">ลบงานนำเสนอนี้</button></article>`).join(''):'<div class="empty">ยังไม่มีงานนำเสนอ</div>'}async function load(){try{const x=await request();render(x.presentations||[])}catch(e){notice(e.message)}}window.removeSlide=async id=>{if(!confirm('ต้องการลบงานนำเสนอนี้หรือไม่'))return;try{await request({action:'delete_presentation',id});load()}catch(e){notice(e.message)}};let imageData='';$('#image').onchange=()=>{const f=$('#image').files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{imageData=reader.result;$('#preview').src=imageData;$('#preview').style.display='block'};reader.readAsDataURL(f)};$('#form').onsubmit=async e=>{e.preventDefault();try{await request({action:'create_presentation',title:$('#title').value,description:$('#description').value,image_data:imageData});e.target.reset();imageData='';$('#preview').style.display='none';load();notice('บันทึกงานนำเสนอแล้ว')}catch(x){notice(x.message)}};load();
</script></body></html>
